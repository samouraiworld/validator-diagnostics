# clamd configuration for the docker-compose stack, bind-mounted over
# /etc/clamav/clamd.conf in the clamav/clamav:stable image.
#
# It exists for one reason: clamd's stock limits are far below the size
# of archive this portal accepts. StreamMaxLength defaults to 25 MiB and
# MaxFileSize/MaxScanSize to 100 MiB, so with stock config clamd rejects
# essentially every real submission with "INSTREAM size limit exceeded."
# and the portal — correctly failing closed — answers 503.
#
# 2 GiB is the number this deployment standardises on: it is the same
# bound as cmd/portal's -max-upload-size default, comfortably above any
# realistic validator archive, and safely under ClamAV's own 4 GiB
# ceiling for these directives. Change one of the two and you must change
# the other, or uploads clamd cannot scan will start being rejected.
DatabaseDirectory /var/lib/clamav
LogTime yes
Foreground yes

TCPSocket 3310
LocalSocket /tmp/clamd.sock

StreamMaxLength 2G
MaxFileSize 2G
MaxScanSize 2G

# Streaming 2 GiB over a slow uplink means long gaps are normal; the
# stock 30s read timeout would hang up on a legitimate upload.
ReadTimeout 600
